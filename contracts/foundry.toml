[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read", path = "../data/replays" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./cache" },
]

[rpc_endpoints]
xlayer = "${XLAYER_RPC_URL}"

[fmt]
line_length = 120

[lint]
lint_on_build = false
